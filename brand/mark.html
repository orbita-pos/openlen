<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenLen mark — cleaned</title>
<style>
  body { margin: 0; background: #F7F2EA; font-family: -apple-system, system-ui, sans-serif; padding: 48px; }
  h1 { font-size: 20px; color: #1C1815; margin: 0 0 4px; }
  p { font-size: 13px; color: #6f6457; margin: 0 0 28px; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .sw { width: 150px; height: 150px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  .cream { background: #fff; border: 1px solid #E4DCCE; }
  .dark { background: #13110F; }
  .sizes { display: flex; align-items: flex-end; gap: 20px; padding-left: 8px; }
  .sizes div { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sizes span { font-size: 10px; color: #9a8d7c; font-weight: 600; }
</style>
</head>
<body>
  <h1>OpenLen mark — sin el círculo blanco</h1>
  <p>Anillo coral limpio con gradiente cálido. Sin highlight, sin dot.</p>
  <div class="row">
    <div class="sw cream">
      <svg width="104" height="104" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="g" x1="14" y1="11" x2="52" y2="55" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FF7E55"/><stop offset="0.52" stop-color="#FF5A36"/><stop offset="1" stop-color="#E5391A"/>
        </linearGradient></defs>
        <circle cx="32" cy="32" r="19.5" stroke="url(#g)" stroke-width="15"/>
      </svg>
    </div>
    <div class="sw dark">
      <svg width="104" height="104" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="19.5" stroke="url(#g)" stroke-width="15"/>
      </svg>
    </div>
    <div class="sizes">
      <div>
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="19.5" stroke="url(#g)" stroke-width="15"/></svg>
        <span>32</span>
      </div>
      <div>
        <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="19.5" stroke="url(#g)" stroke-width="15"/></svg>
        <span>16</span>
      </div>
    </div>
  </div>
</body>
</html>
