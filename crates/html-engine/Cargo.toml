[package]
name = "openlen-html-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rust HTML engine for OpenLen (parse, normalize, ID-tagged ops, sanitize, minify)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
lol_html = "1"
thiserror = "1"
regex = "1"
once_cell = "1"
kuchikiki = "0.8"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ops"
harness = false
