[package]
name = "openlen-rate-limit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OpenLen unified rate limiter — in-memory token buckets + Postgres sliding-window sessions"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default-on for the napi cdylib build that ships @openlen/rate-limit. Pure-
# Rust consumers (e.g. crates/edge) depend with `default-features = false` to
# skip pulling napi + the napi-build script into their dep graph.
default = ["napi-bindings"]
napi-bindings = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "async", "tokio_rt"], optional = true }
napi-derive = { version = "2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "uuid", "macros"] }
dashmap = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
