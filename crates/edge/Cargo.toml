[package]
name = "openlen-edge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OpenLen edge proxy — TLS termination + static file serving for *.openlen.com and custom domains"

[[bin]]
name = "openlen-edge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["http2", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "compression-gzip", "set-header"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
mime_guess = "2"
percent-encoding = "2"
once_cell = "1"

[dev-dependencies]
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
