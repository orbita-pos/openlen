[package]
name = "openlen-ai-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OpenLen AI streaming gateway — Gemini streaming with cancel propagation + usage-metadata billing"

[lib]
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-stream = "0.3"
thiserror = "1"
tracing = "0.1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "net"] }
