<style>
  :root{
    --pink:#FF1533;
    --pink-soft:#FF6E82;
    --lilac:#D46A85;       /* segundo acento propio */
    --cyan:#8E1E3F;
    --malva:#180509;
    --ink:#0a0406;
    --glow: 0 0 12px rgba(255,21,51,.85), 0 0 30px rgba(255,21,51,.4);
    --glow-l: 0 0 12px rgba(212,106,133,.8);
    /* SWAP: pega aquí la URL de tu FOTO DE FONDO (entre comillas) */
    --bg-photo: none; /* fondo limpio: radial negro+vino. Pega una url("...") si algún día quiere foto */
  }
  *{ -webkit-tap-highlight-color: transparent; box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:'Space Grotesk',sans-serif; background:var(--ink); color:var(--pink-soft); min-height:100dvh; overflow-x:hidden; }

  /* fondo */
  .bg-layer{ position:fixed; top:0; left:0; width:100%; height:100vh; height:100lvh; z-index:-4;
    background: var(--bg-photo) center 18%/cover no-repeat,
      radial-gradient(122% 96% at 50% 5%, #a52344 0%, #5a1225 25%, #22070e 58%, #060205 100%);
    filter:brightness(.92) saturate(1.3); transform:scale(1.12); transform-origin:center; }
  .dots-layer{ position:fixed; inset:0; z-index:-3; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.18) 1px, transparent 1.7px); background-size:5px 5px; mix-blend-mode:overlay; opacity:.5; }
  .grain{ position:fixed; inset:-200%; z-index:-2; pointer-events:none; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain 1.1s steps(4) infinite; }
  @keyframes grain{ to{ transform:translate(8%,6%); } }
  .vignette{ position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(ellipse 72% 64% at 50% 40%, transparent 26%, rgba(8,5,7,.6) 78%, rgba(6,3,5,.95) 100%); }
  #stars{ position:fixed; inset:0; z-index:40; pointer-events:none; }

  /* tipografía y utilidades propias */
  .serif-i{ font-family:'Playfair Display',serif; font-style:italic; }
  .glow-pink{ text-shadow:var(--glow); }
  .glow-lilac{ text-shadow:var(--glow-l); }

  /* username con aberración cromática (glitch propio) */
  .uname{ font-family:'Rubik Glitch',cursive; position:relative; display:inline-block; color:#fff;
    letter-spacing:1px; line-height:1; }
  .uname::before,.uname::after{ content:attr(data-t); position:absolute; inset:0; }
  .uname::before{ color:var(--cyan); transform:translate(-2px,1px); mix-blend-mode:screen; animation:gl 3.2s infinite steps(2); }
  .uname::after{ color:var(--pink); transform:translate(2px,-1px); mix-blend-mode:screen; animation:gl2 2.7s infinite steps(2); }
  @keyframes gl{ 0%,92%,100%{clip-path:inset(0 0 0 0); transform:translate(-2px,1px)} 94%{clip-path:inset(40% 0 30% 0); transform:translate(-5px,0)} 97%{clip-path:inset(10% 0 60% 0); transform:translate(3px,0)} }
  @keyframes gl2{ 0%,90%,100%{clip-path:inset(0 0 0 0); transform:translate(2px,-1px)} 93%{clip-path:inset(60% 0 10% 0); transform:translate(5px,0)} 96%{clip-path:inset(20% 0 50% 0); transform:translate(-3px,0)} }

  /* tarjeta con esquina recortada (firma visual) */
  .notch{ position:relative;
    background:linear-gradient(180deg, rgba(255,21,51,.12), rgba(29,22,28,.42));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    box-shadow: 0 10px 34px rgba(0,0,0,.4); }
  .notch::before{ content:""; position:absolute; inset:0; pointer-events:none;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    border:1px solid rgba(255,110,130,.3); }
  .notch.lil::before{ border-color:rgba(212,106,133,.34); }

  /* corchetes de esquina */
  .bracket{ position:relative; }
  .bracket::before,.bracket::after{ content:""; position:absolute; width:14px; height:14px; border:2px solid var(--lilac); opacity:.65; filter:drop-shadow(0 0 4px rgba(212,106,133,.7)); }
  .bracket::before{ top:-6px; left:-6px; border-right:0; border-bottom:0; }
  .bracket::after{ bottom:-6px; right:-6px; border-left:0; border-top:0; }

  /* cinta marquee */
  .ribbon{ overflow:hidden; }
  .ribbon > div{ display:inline-flex; white-space:nowrap; animation:slide 18s linear infinite; }
  @keyframes slide{ to{ transform:translateX(-50%); } }

  .ph{ background:linear-gradient(135deg,#FF6E8233,#D46A8522,#5c102644); position:relative; overflow:hidden; }
  .ph::after{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 8px, transparent 8px 16px); }

  .social svg{ filter:drop-shadow(0 0 6px rgba(255,21,51,.7)); transition:transform .25s cubic-bezier(.2,1.4,.4,1), filter .25s; }
  .social:hover svg, .social:active svg{ transform:scale(1.3) translateY(-3px) rotate(-6deg); filter:drop-shadow(0 0 16px rgba(255,21,51,1)); }

  input[type=range].seek{ -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer; }
  input[type=range].seek::-webkit-slider-runnable-track{ height:6px; border-radius:99px;
    background:linear-gradient(90deg,var(--pink) var(--p,0%), rgba(212,106,133,.22) var(--p,0%)); }
  input[type=range].seek::-moz-range-track{ height:6px; border-radius:99px; background:rgba(212,106,133,.22); }
  input[type=range].seek::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:13px; height:13px; margin-top:-3.5px; border-radius:99px; background:#fff; box-shadow:0 0 10px rgba(255,21,51,1); }
  input[type=range].seek::-moz-range-thumb{ width:13px; height:13px; border:none; border-radius:99px; background:#fff; box-shadow:0 0 10px rgba(255,21,51,1); }

  @keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  @keyframes orbit{ to{ transform:rotate(360deg); } }
  @keyframes pulse-ring{ 0%{box-shadow:0 0 0 0 rgba(126,224,160,.6)} 70%{box-shadow:0 0 0 7px rgba(126,224,160,0)} 100%{box-shadow:0 0 0 0 rgba(126,224,160,0)} }
  .online-dot{ animation:pulse-ring 2s infinite; }

  /* tile del canal en la card de twitch */
  .tw-tile{ width:46px; height:46px; border-radius:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg, rgba(142,30,63,.5), rgba(30,10,16,.6)); border:1px solid rgba(212,106,133,.25); }
  .tw-tile svg{ filter:drop-shadow(0 0 6px rgba(255,21,51,.45)); }
  .tw-tile.is-live{ background:linear-gradient(150deg, rgba(255,21,51,.32), rgba(142,30,63,.5)); border-color:rgba(255,21,51,.6);
    box-shadow:0 0 0 0 rgba(255,21,51,.5); animation:twpulse 1.9s infinite; }
  @keyframes twpulse{ 0%{box-shadow:0 0 0 0 rgba(255,21,51,.5)} 70%{box-shadow:0 0 0 11px rgba(255,21,51,0)} 100%{box-shadow:0 0 0 0 rgba(255,21,51,0)} }

  /* live dot (banner twitch) */
  .live-dot{ width:12px; height:12px; border-radius:99px; background:#eb0400; flex-shrink:0;
    box-shadow:0 0 0 0 rgba(235,4,0,.6); animation:livePulse 1.6s infinite; }
  @keyframes livePulse{ 0%{box-shadow:0 0 0 0 rgba(235,4,0,.7)} 70%{box-shadow:0 0 0 9px rgba(235,4,0,0)} 100%{box-shadow:0 0 0 0 rgba(235,4,0,0)} }
  /* anillo live sobre icono twitch */
  .twitch-live::after{ content:"LIVE"; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    font-family:'Space Grotesk'; font-size:8px; font-weight:700; letter-spacing:1px; color:#fff;
    background:#eb0400; padding:1px 4px; border-radius:4px; box-shadow:0 0 8px rgba(235,4,0,.9); }
  .twitch-live svg{ filter:drop-shadow(0 0 10px rgba(212,106,133,1)) !important; }

  /* galería */
  .gcell{ aspect-ratio:1; border-radius:14px; overflow:hidden; cursor:pointer; position:relative;
    border:1px solid rgba(255,110,130,.22); transition:transform .25s, box-shadow .25s; }
  .gcell:hover, .gcell:active{ transform:scale(1.05); box-shadow:0 0 16px rgba(255,21,51,.7); z-index:1; }
  .gcell img{ width:100%; height:100%; object-fit:cover; object-position:center 16%; display:block; }
  /* lightbox */
  #lightbox{ position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(8,5,7,.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); opacity:0; transition:opacity .25s; padding:24px; }

<script>
/* ===== estrellas flotantes (firma) ===== */
(function(){
  const c = document.getElementById('stars'), x = c.getContext('2d');
  let W,H,stars;
  function init(){ W=c.width=innerWidth; H=c.height=innerHeight;
    stars = Array.from({length:Math.min(46,Math.floor(W/12))},()=>({
      x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.6+.4,
      a:Math.random(), tw:Math.random()*.04+.01, vy:Math.random()*.18+.04,
      c: Math.random()>.5 ? '255,21,51' : '212,106,133' }));
  }
  /* ---- estrellas que salen al mover el mouse / dedo ---- */
  const trail = [];
  function spark(px,py){
    const n = 1 + (Math.random()*2|0);
    for(let i=0;i<n;i++){
      trail.push({ x:px+(Math.random()*16-8), y:py+(Math.random()*16-8),
        size:Math.random()*8+5, life:1, vx:(Math.random()-.5)*.8, vy:(Math.random()*.6+.2),
        rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.12,
        c: Math.random()>.5 ? '255,21,51' : '212,106,133' });
    }
    if(trail.length>90) trail.splice(0, trail.length-90);
  }
  let lastE=0;
  function onMove(e){ const now=performance.now(); if(now-lastE<22) return; lastE=now;
    const t = e.touches ? e.touches[0] : e; if(!t) return; spark(t.clientX, t.clientY); }
  addEventListener('mousemove', onMove, {passive:true});
  addEventListener('touchmove', onMove, {passive:true});

  function drawStar(cx,cy,r,rot,fill){
    x.save(); x.translate(cx,cy); x.rotate(rot); x.beginPath();
    for(let i=0;i<4;i++){ const a=i*Math.PI/2;
      x.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      x.quadraticCurveTo(0,0, Math.cos(a+Math.PI/4)*r*0.28, Math.sin(a+Math.PI/4)*r*0.28);
    }
    x.closePath(); x.fillStyle=fill; x.fill(); x.restore();
  }

  function draw(){ x.clearRect(0,0,W,H);
    for(const st of stars){ st.a+=st.tw; const o=(Math.sin(st.a)*.4+.5);
      st.y-=st.vy; if(st.y<-4){ st.y=H+4; st.x=Math.random()*W; }
      x.fillStyle='rgba('+st.c+','+o.toFixed(2)+')';
      x.beginPath(); x.arc(st.x,st.y,st.s,0,7); x.fill();
    }
    for(let i=trail.length-1;i>=0;i--){ const p=trail[i];
      p.life-=0.028; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.life<=0){ trail.splice(i,1); continue; }
      x.shadowBlur=10; x.shadowColor='rgba('+p.c+','+p.life.toFixed(2)+')';
      drawStar(p.x, p.y, p.size*p.life, p.rot, 'rgba('+p.c+','+p.life.toFixed(2)+')');
      x.shadowBlur=0;
    }
    requestAnimationFrame(draw); }
  init();draw(); addEventListener('resize',init);
})();

/* ===== contador de vistas REAL (Abacus · incrementa por visita, CORS-ok) =====
   value = visitas reales; BASE = arranque vanidoso para no empezar en 0.
   SWAP: cambia el namespace "sally-bio" si quieres reiniciar el contador. */
(function(){ const el=document.getElementById('views'); const BASE=100;
  const URL="https://abacus.jasoncameron.dev/hit/sally-bio/views";
  function anim(target){ const s=performance.now(),d=1400;
    (function t(n){ const k=Math.min(1,(n-s)/d),e=1-Math.pow(1-k,3);
      el.textContent=Math.round(target*e).toLocaleString('en-US'); if(k<1)requestAnimationFrame(t); })(s); }
  fetch(URL).then(r=>r.json()).then(j=>anim(BASE+(j.value||0))).catch(()=>anim(BASE));
})();

/* ===== EN DIRECTO EN TWITCH =====
   Auto-detecta si el canal está en vivo con Decapi (gratis, sin API key).
   LIVE.now es solo el fallback manual por si Decapi no responde. */
const LIVE = {
  channel: "nutsaally",            // SWAP: su canal de twitch
  now: false,                      // fallback manual si Decapi no responde
  title: "jugando en vivo ♡",      // fallback de título cuando está live
  offline: "sígueme en Twitch ♡"   // texto cuando NO está en vivo
};
(function(){
  const url = "https://twitch.tv/" + LIVE.channel;
  const banner = document.getElementById('liveBanner');
  const tw = document.getElementById('twitchSocial');
  const icon = document.getElementById('liveIcon');
  const state = document.getElementById('liveState');
  const badge = document.getElementById('liveBadge');
  const title = document.getElementById('liveTitle');
  tw.href = url; banner.href = url;
  function paint(isLive, text){
    if(isLive){
      banner.style.background = "linear-gradient(100deg, rgba(255,21,51,.16), rgba(142,30,63,.3))";
      banner.style.border = "1px solid rgba(255,21,51,.45)";
      banner.style.boxShadow = "0 0 26px rgba(255,21,51,.32)";
      icon.classList.add('is-live');
      state.textContent = "EN DIRECTO"; state.style.color = "#fff";
      badge.style.display = "";
      title.textContent = text || LIVE.title;
      tw.classList.add('twitch-live');
    } else {
      banner.style.background = "linear-gradient(100deg, rgba(40,14,22,.6), rgba(20,8,12,.4))";
      banner.style.border = "1px solid rgba(212,106,133,.22)";
      banner.style.boxShadow = "none";
      icon.classList.remove('is-live');
      state.textContent = "OFFLINE"; state.style.color = "rgba(255,255,255,.7)"; state.style.textShadow = "none";
      badge.style.display = "none";
      title.textContent = LIVE.offline;
      tw.classList.remove('twitch-live');
    }
  }
  // 1) estado manual al instante (sin parpadeo)
  paint(LIVE.now, LIVE.title);
  // 2) auto-detección en vivo con Decapi. Si responde, manda sobre el manual.
  const ch = encodeURIComponent(LIVE.channel);
  fetch("https://decapi.me/twitch/uptime/" + ch, {cache:"no-store"})
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(t => {
      if(/offline|unavailable|error|not found|banned/i.test(t)){ paint(false); return; }
      fetch("https://decapi.me/twitch/game/" + ch, {cache:"no-store"})
        .then(r => r.ok ? r.text() : "")
        .then(g => paint(true, (g && !/offline|error|unavailable/i.test(g)) ? ("jugando " + g + " ♡") : LIVE.title))
        .catch(() => paint(true, LIVE.title));
    })
    .catch(() => {/* Decapi caído → se queda el estado manual de arriba */});
})();


</script>
