[workspace]
members = ["crates/html-engine", "crates/edge", "crates/rate-limit", "crates/images"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/jesusbernalrj/inari-pages"

# openlen-edge binary size cap: **≤ 8.0 MiB stripped** (Linux x86_64; the
# Windows `.exe` we build for dev mirrors it within ~50 KiB). Tracked as a
# soft target — exceeding it should trigger a profile review, not block work.
# The cap was 7.5 MiB through F2 S6; S6's Prometheus exporter (~200 KiB net)
# pushed the binary to 7.66 MiB, and F2 S7 promotes the cap to 8.0 MiB to
# accommodate the metrics surface plus headroom for the apex / shared-uploads
# routing additions in this session. A future drop is available via the
# regex-removal refactor sketched in the S6 handoff Open Q #3 (~500 KiB
# savings) — out of scope for migration session.
[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"

# Trim size on dependencies that aren't on the per-request hot path. The
# edge crate itself keeps opt-level=3 because routing + proxy forwarding fire
# on every request; sqlx, moka, and aws-lc-rs all sit behind cache hits or
# the handshake (both I/O-bound), so `opt-level = "s"` here saves ~190 KB
# stripped without measurable RPS impact.
[profile.release.package.sqlx]
opt-level = "s"
[profile.release.package.sqlx-core]
opt-level = "s"
[profile.release.package.sqlx-postgres]
opt-level = "s"
[profile.release.package.moka]
opt-level = "s"
# F2 S5: ACME-related deps. The issue path runs at most a handful of times
# per day per domain — completely off the hot request path — so trading
# inlining for size is the obvious move. instant-acme bundles ring + rcgen
# pathways which are the biggest chunks.
[profile.release.package.instant-acme]
opt-level = "z"
[profile.release.package.hyper-rustls]
opt-level = "z"
[profile.release.package.rustls-platform-verifier]
opt-level = "z"
[profile.release.package.rustls-platform-verifier-android]
opt-level = "z"
[profile.release.package.rcgen]
opt-level = "z"
[profile.release.package.notify]
opt-level = "z"
[profile.release.package.notify-types]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "s"
[profile.release.package.dashmap]
opt-level = "s"
# x509/asn-related — only ever touched during cert load + ACME finalize.
[profile.release.package.x509-parser]
opt-level = "z"
[profile.release.package.yasna]
opt-level = "z"
[profile.release.package.der-parser]
opt-level = "z"
[profile.release.package.asn1-rs]
opt-level = "z"
[profile.release.package.ring]
opt-level = "s"
# F2 S6: webpki-roots ships the Mozilla CA bundle as static data; nothing
# inlines into hot code, so `z` is essentially free here.
[profile.release.package.webpki-roots]
opt-level = "z"
# Prometheus exporter — the histogram + text rendering only fires on /metrics
# scrapes, far off the request path.
[profile.release.package.metrics-exporter-prometheus]
opt-level = "z"
[profile.release.package.metrics-util]
opt-level = "z"
[profile.release.package.metrics-process]
opt-level = "z"
# `metrics` itself (the facade) is on the request hot path via the
# `counter!`/`histogram!` macros. Keep it at `s` to retain inlining but trim
# the cold helpers.
[profile.release.package.metrics]
opt-level = "s"
[profile.release.package.quanta]
opt-level = "z"
# regex_automata + regex_syntax are pulled by the `regex` crate the routing
# layer uses for hostname validation. The matchers are touched per request
# but the compiled state machines + AC trees are large; "s" keeps inlining
# for the hot path while trimming the cold construction code.
[profile.release.package.regex-automata]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "z"
[profile.release.package.aho-corasick]
opt-level = "s"
# Cold-path crypto used by ACME signing / cert generation. Shaves
# another ~150 KB by giving up inlining inside the seldom-used path.
[profile.release.package.aws-lc-rs]
opt-level = "z"
[profile.release.package.aws-lc-sys]
opt-level = "z"

[profile.bench]
lto = true
opt-level = 3
codegen-units = 1
