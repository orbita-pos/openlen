[workspace]
members = ["crates/html-engine", "crates/edge"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/jesusbernalrj/inari-pages"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"

# Trim size on dependencies that aren't on the per-request hot path. The
# edge crate itself keeps opt-level=3 because routing + proxy forwarding fire
# on every request; sqlx, moka, and aws-lc-rs all sit behind cache hits or
# the handshake (both I/O-bound), so `opt-level = "s"` here saves ~190 KB
# stripped without measurable RPS impact.
[profile.release.package.sqlx]
opt-level = "s"
[profile.release.package.sqlx-core]
opt-level = "s"
[profile.release.package.sqlx-postgres]
opt-level = "s"
[profile.release.package.moka]
opt-level = "s"
# F2 S5: ACME-related deps. The issue path runs at most a handful of times
# per day per domain — completely off the hot request path — so trading
# inlining for size is the obvious move. instant-acme bundles ring + rcgen
# pathways which are the biggest chunks.
[profile.release.package.instant-acme]
opt-level = "z"
[profile.release.package.hyper-rustls]
opt-level = "z"
[profile.release.package.rustls-platform-verifier]
opt-level = "z"
[profile.release.package.rustls-platform-verifier-android]
opt-level = "z"
[profile.release.package.rcgen]
opt-level = "z"
[profile.release.package.notify]
opt-level = "z"
[profile.release.package.notify-types]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "s"
[profile.release.package.dashmap]
opt-level = "s"
# x509/asn-related — only ever touched during cert load + ACME finalize.
[profile.release.package.x509-parser]
opt-level = "z"
[profile.release.package.yasna]
opt-level = "z"
[profile.release.package.der-parser]
opt-level = "z"
[profile.release.package.asn1-rs]
opt-level = "z"
[profile.release.package.simple_asn1]
opt-level = "z"
[profile.release.package.ring]
opt-level = "s"
# Cold-path crypto used by ACME signing / cert generation. Shaves
# another ~150 KB by giving up inlining inside the seldom-used path.
[profile.release.package.aws-lc-rs]
opt-level = "z"
[profile.release.package.aws-lc-sys]
opt-level = "z"

[profile.bench]
lto = true
opt-level = 3
codegen-units = 1
