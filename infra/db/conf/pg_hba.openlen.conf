# /etc/postgresql/17/main/pg_hba.conf  (rendered by setup-db-box.sh; __APP_IP__ substituted)
# Default-deny. Only the app box (private IP) + local admin/backup may connect.
#
# TYPE      DATABASE        USER              ADDRESS         METHOD

# Local admin over the Unix socket (peer = OS user must be postgres).
local       all             postgres                          peer

# App tier (CX22, private network) — TLS required + scram. Least-priv roles:
hostssl     openlen         openlen_app       __APP_IP__/32   scram-sha-256
hostssl     openlen         openlen_migrate   __APP_IP__/32   scram-sha-256
hostssl     openlen         openlen_edge_ro   __APP_IP__/32   scram-sha-256

# Metrics exporter (runs on this box) over the socket / loopback.
local       openlen         openlen_metrics                   scram-sha-256
host        openlen         openlen_metrics   127.0.0.1/32     scram-sha-256

# Backups + replication (pgBackRest / a future warm replica) — local + loopback.
local       replication     openlen_backup                    scram-sha-256
host        replication     openlen_backup    127.0.0.1/32     scram-sha-256
local       openlen         openlen_backup                    scram-sha-256

# Everything else is rejected explicitly (belt-and-suspenders behind the firewall).
host        all             all               0.0.0.0/0        reject
host        all             all               ::/0             reject
