# /etc/postgresql/17/main/conf.d/10-openlen.conf  (rendered by setup-db-box.sh)
# Tuned for a DEDICATED 8 GB Hetzner CX33 on ZFS. __PRIVATE_IP__ is substituted.

# ── Listener — localhost + private IP ONLY. Never 0.0.0.0 / a public interface ──
listen_addresses = 'localhost,__PRIVATE_IP__'
port = 5432
max_connections = 50            # PgBouncer fans many app clients onto these

# ── Memory (8 GB box, DB only; ZFS ARC capped ~3 GiB via /etc/modprobe.d/zfs.conf) ──
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB

# ── NVMe planner ──
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off                       # tiny PK/index lookups don't benefit; avoids planner overhead

# ── WAL / checkpoints ──
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
full_page_writes = off          # SAFE on ZFS copy-on-write — removes WAL write amplification

# ── WAL archiving — STAYS OFF until pgBackRest exists (Tier 2). ──
# Turning archive_mode on without a working archive_command makes pg_wal grow
# until the disk fills. Flip these (and restart) in MIGRATION_RUNBOOK step "Tier 2".
#archive_mode = on
#archive_command = 'pgbackrest --stanza=openlen archive-push %p'
#archive_timeout = 60s

# ── Observability (Neon gates Query Insights; here it's free + unbounded) ──
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
auto_explain.log_min_duration = '500ms'
auto_explain.log_analyze = off  # keep off in prod (analyze adds per-query overhead)

# ── Autovacuum (write-light app; keep even tiny tables analyzed for good plans) ──
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ── Security ──
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'

# ── Logging ──
log_min_duration_statement = 1000   # log anything slower than 1s
log_checkpoints = on
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
