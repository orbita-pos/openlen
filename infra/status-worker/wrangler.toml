name = "openlen-status"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false

routes = [
  { pattern = "status.openlen.com/*", zone_name = "openlen.com" }
]

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "openlen-status"
database_id = "FILL_AT_SETUP"

[vars]
CANARY_HOST = "FILL_AT_SETUP"
ALERT_FROM = "OpenLen Status <alerts@openlen.com>"
