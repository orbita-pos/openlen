# /etc/nginx/sites-available/openlen
#
# Two roles in one file:
#
#   1. Apex + www — reverse-proxy openlen.com and www.openlen.com to the
#      Next.js app running on 127.0.0.1:3000 (managed by openlen-app.service).
#      /uploads/ and /_next/static/ are served directly from disk to bypass
#      Node; everything else proxies through.
#
#   2. Wildcard *.openlen.com — one directory per subdomain under
#      /var/www/openlen/<sub>/. Used by the deploy-a-landing flow.
#
# Subdomain regex enforces DNS RFC label rules (lowercase alphanumerics +
# hyphens, 1–63 chars, can't start with hyphen) and bans path-traversal
# attempts before nginx touches the filesystem.

# ─── HTTP → HTTPS redirect (apex + wildcard) ─────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name openlen.com *.openlen.com;

  # Let certbot use the HTTP-01 fallback path in case DNS-01 ever fails.
  location /.well-known/acme-challenge/ {
    root /var/www/openlen/_default;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── Apex + www HTTPS server: reverse proxy to Next.js ──────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name openlen.com www.openlen.com;

  ssl_certificate     /etc/letsencrypt/live/openlen.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openlen.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff"                              always;
  add_header X-Frame-Options           "SAMEORIGIN"                           always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

  # 10 MB cap covers the largest plausible upload (raw photo from /api/upload).
  # Smaller would block legitimate hero-image uploads.
  client_max_body_size 10m;

  # User-uploaded files — served straight from disk so we don't burn Node
  # event-loop cycles on static bytes. Path matches UPLOADS_DIR in
  # openlen-app.service.
  location /uploads/ {
    alias /var/openlen/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    access_log off;
  }

  # Next.js build-time static assets (content-hashed by Next, so safe to
  # cache forever). Path matches the `cp` step in deploy.sh.
  location /_next/static/ {
    alias /opt/openlen-app/.next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
  }

  # Everything else → Next.js. proxy_buffering off keeps SSE streams from
  # /api/generate flowing token-by-token instead of being chunked into
  # nginx's buffer. proxy_read_timeout 90s covers a worst-case generation
  # (real Together calls average ~30s).
  location / {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 90s;
    proxy_buffering    off;
  }

  access_log /var/log/nginx/openlen-apex-access.log;
  error_log  /var/log/nginx/openlen-apex-error.log;
}

# ─── Wildcard subdomain HTTPS server ─────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  # Named-capture regex pulls the subdomain into $sub. The apex + www are
  # matched by the dedicated server block above, so this regex only ever
  # sees real subdomains (host.openlen.com, not openlen.com itself).
  server_name "~^(?<sub>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.openlen\.com$";

  ssl_certificate     /etc/letsencrypt/live/openlen.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openlen.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Security headers — applied to every served file.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff"                              always;
  add_header X-Frame-Options           "SAMEORIGIN"                           always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

  # One web root per subdomain. $sub is guaranteed by the regex to be a safe
  # DNS label — no slashes, no dots, no traversal possible.
  #
  # `current` is a symlink managed by lib/publish/filesystem.ts that points
  # at the active release dir under `releases/<sha>/`. Atomic deploys flip
  # this symlink via rename(2); rollback reuses the same mechanism.
  root  /var/www/openlen/$sub/current;
  index index.html;

  # User-uploaded files — served straight from disk so the same images that
  # back the workspace also work cross-subdomain (AI-generated images are
  # served from Together's CDN directly; this `alias` only covers files the
  # user uploaded into /var/openlen/uploads). Mirrors the apex /uploads block.
  location /uploads/ {
    alias /var/openlen/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    access_log off;
  }

  # Edge caches aggressively, browser revalidates fast. We purge the CF
  # cache on every publish (lib/publish/cache-purge.ts) so s-maxage=3600
  # is safe — the only window where stale HTML can leak is between the
  # rename(2) finishing and the purge API call returning (<5s). SWR lets
  # the edge keep serving for 24h even if the origin is down.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=60, s-maxage=3600, stale-while-revalidate=86400" always;
  }

  # Cache assets aggressively. Filenames should be content-hashed by the
  # build step if you want true immutability.
  location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|avif)$ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
  }

  # Refuse hidden files (e.g. .env, .git/).
  location ~ /\. {
    deny all;
    log_not_found off;
  }

  # Default route: serve index.html if directory, else file, else 404 → custom.
  location / {
    try_files $uri $uri/ /index.html =404;
  }

  # Friendly 404 when a subdomain isn't deployed.
  error_page 404 /404.html;
  location = /404.html {
    root /var/www/openlen/_default;
    internal;
  }

  # Cap upload size — we only serve static, so 1MB is plenty. Tighten
  # further in Session 11 if needed.
  client_max_body_size 1m;

  access_log /var/log/nginx/openlen-access.log;
  error_log  /var/log/nginx/openlen-error.log;
}

# ─── Catch-all (default server) ──────────────────────────────────────────────
# Anything that hits port 443 without matching apex, www, or the wildcard
# regex falls here. Returns 444 (nginx-only "close connection, no response")
# to drop the request cheaply. Catches malformed Host headers, IP-based
# probes, and unknown domains — preventing them from triggering the
# wildcard root path or hitting the Next.js proxy.
server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name _;

  ssl_certificate     /etc/letsencrypt/live/openlen.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openlen.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  return 444;
}
