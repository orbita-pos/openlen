# /etc/nginx/sites-available/openlen
#
# Wildcard subdomain serving for *.openlen.com — one directory per subdomain
# under /var/www/openlen/<sub>/. Apex openlen.com is NOT served here (Vercel
# handles the Next.js app); this server block only matches subdomains via
# the regex below.
#
# Subdomain regex: lowercase alphanumerics + hyphens, 1–63 chars, can't start
# with hyphen. Matches the DNS RFC label rules and bans path-traversal
# attempts before nginx touches the filesystem.

# ─── HTTP → HTTPS redirect (apex + wildcard) ─────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name openlen.com *.openlen.com;

  # Let certbot use the HTTP-01 fallback path in case DNS-01 ever fails.
  location /.well-known/acme-challenge/ {
    root /var/www/openlen/_default;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── Wildcard subdomain HTTPS server ─────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  # Named-capture regex pulls the subdomain into $sub. Note: apex
  # openlen.com is intentionally NOT in this regex — it points to Vercel
  # via DNS, not this server. If a request for the apex somehow reaches
  # this box, it falls through to the default catch-all below.
  server_name "~^(?<sub>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.openlen\.com$";

  ssl_certificate     /etc/letsencrypt/live/openlen.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openlen.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Security headers — applied to every served file.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff"                              always;
  add_header X-Frame-Options           "SAMEORIGIN"                           always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

  # One web root per subdomain. $sub is guaranteed by the regex to be a safe
  # DNS label — no slashes, no dots, no traversal possible.
  root  /var/www/openlen/$sub;
  index index.html;

  # Cache HTML lightly so updates show up fast.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Cache assets aggressively. Filenames should be content-hashed by the
  # build step if you want true immutability.
  location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|avif)$ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
  }

  # Refuse hidden files (e.g. .env, .git/).
  location ~ /\. {
    deny all;
    log_not_found off;
  }

  # Default route: serve index.html if directory, else file, else 404 → custom.
  location / {
    try_files $uri $uri/ /index.html =404;
  }

  # Friendly 404 when a subdomain isn't deployed.
  error_page 404 /404.html;
  location = /404.html {
    root /var/www/openlen/_default;
    internal;
  }

  # Cap upload size — we only serve static, so 1MB is plenty. Tighten
  # further in Session 11 if needed.
  client_max_body_size 1m;

  access_log /var/log/nginx/openlen-access.log;
  error_log  /var/log/nginx/openlen-error.log;
}

# ─── Catch-all (default server) ──────────────────────────────────────────────
# Anything that hits port 443 without matching the wildcard regex falls
# here. Returns 444 (nginx-only "close connection, no response") to drop
# the request cheaply. Prevents stray apex traffic, malformed Host headers,
# IP-based probes, etc. from triggering the wildcard root path.
server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name _;

  ssl_certificate     /etc/letsencrypt/live/openlen.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openlen.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  return 444;
}
