# /etc/needrestart/conf.d/openlen.conf — needrestart never restarts the app or realtime on its own.
#
# On 2026-10-15 at 06:15 UTC Ubuntu's daily unattended-upgrade updated libx11
# while a Len turn was running. The eyes' Chromium (children of Node, inside the
# app's cgroup) still had the old library mapped, so needrestart ran
# `systemctl restart openlen-app.service`. Node didn't exit while the turn ran;
# systemd waited TimeoutStopSec (90 s) and killed it: 91 s down, the turn lost.
#
# With 0 the restart is deferred, not dropped: needrestart lists it under
# "Service restarts being deferred" (as it does for dbus and getty), and the
# next deploy restarts the app on the new libraries. Realtime (also Node; its
# subscribers drop and reconnect) gets the same treatment: the deploy restarts
# it too (infra/scripts/deploy.ps1).
#
# Postgres is left out on purpose. Its package comes from apt.postgresql.org,
# which unattended-upgrade doesn't touch, but it maps Ubuntu's libraries
# (libc, libssl, libxml2, ICU…) and needrestart restarts it when one changes:
# 2026-10-01 and 2026-10-10 (libxml2: both clusters, ~3 s). No deploy restarts
# Postgres, so deferring it would leave it on the old libraries indefinitely.
#
# Installed by infra/app/install-app.sh. Read by the `conf.d` loop at the end
# of /etc/needrestart/needrestart.conf, as Perl.
$nrconf{override_rc}{qr(^openlen-app\.service$)} = 0;
$nrconf{override_rc}{qr(^openlen-realtime\.service$)} = 0;
