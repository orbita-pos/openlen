<!doctype html>
<html lang="es" style="--ol-bg:#0e0a0d; --ol-surface:#1d161c; --ol-fg:#ffb3dd; --ol-border:rgba(255,179,221,.22); --ol-accent:#ff8fcb; --ol-accent-r:255,143,203; --ol-font-display:'Playfair Display',serif; --ol-r-scale:1.3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi tienda · Hoshi</title>
<meta name="description" content="Tu link-in-bio con estética neón: links, galería, tienda por DM/WhatsApp y un formulario para pedidos a medida.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Playfair+Display:ital,wght@1,500;1,600;1,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ol-bg:#0e0a0d; --ol-surface:#1d161c; --ol-fg:#ffb3dd; --ol-fg-strong:#fff;
    --ol-border:rgba(255,179,221,.22);
    --ol-accent:#ff8fcb; --ol-accent-r:255,143,203;
    --ol-accent-2:#c9a7ff; --ol-accent-2-r:201,167,255;   /* lila (no-canónico) */
    --ol-cyan:#8ff0ff;                                      /* glitch (no-canónico) */
    --ol-font-display:'Playfair Display',serif; --ol-r-scale:1.3;
    --glow:0 0 12px rgba(var(--ol-accent-r),.85), 0 0 30px rgba(var(--ol-accent-r),.4);
    --glow-l:0 0 12px rgba(var(--ol-accent-2-r),.8);
  }
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  body{ background:var(--ol-bg); color:var(--ol-fg); font-family:'Space Grotesk',sans-serif;
    min-height:100dvh; overflow-x:hidden; }

  /* ── fondo neón auto-contenido ── */
  .bg-layer{ position:fixed; inset:0; z-index:-4; pointer-events:none;
    background:radial-gradient(130% 100% at 50% 8%, rgba(74,47,68,.85) 0%, rgba(42,30,39,.9) 50%, var(--ol-bg) 100%); }
  .dots-layer{ position:fixed; inset:0; z-index:-3; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.16) 1px, transparent 1.7px); background-size:5px 5px;
    mix-blend-mode:overlay; opacity:.45; }
  .stars{ position:fixed; inset:0; z-index:-3; pointer-events:none; opacity:.7;
    background-image:
      radial-gradient(1.4px 1.4px at 18% 28%, rgba(var(--ol-accent-r),.9), transparent),
      radial-gradient(1.2px 1.2px at 72% 16%, rgba(var(--ol-accent-2-r),.9), transparent),
      radial-gradient(1.6px 1.6px at 44% 64%, rgba(255,255,255,.9), transparent),
      radial-gradient(1.2px 1.2px at 88% 52%, rgba(var(--ol-accent-r),.85), transparent),
      radial-gradient(1.3px 1.3px at 28% 84%, rgba(var(--ol-accent-2-r),.85), transparent);
    animation:twinkle 4.5s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.45} 50%{opacity:.9} }
  .vignette{ position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:radial-gradient(ellipse 74% 66% at 50% 40%, transparent 26%, rgba(8,5,7,.6) 78%, rgba(6,3,5,.95) 100%); }

  /* ── tipografía propia ── */
  .display{ font-family:var(--ol-font-display); }
  .serif-i{ font-family:var(--ol-font-display); font-style:italic; }
  .glow-pink{ text-shadow:var(--glow); }
  .glow-lilac{ text-shadow:var(--glow-l); }

  /* username con aberración cromática (glitch, CSS puro) */
  .uname{ font-family:'Rubik Glitch',cursive; position:relative; display:inline-block; color:var(--ol-fg-strong);
    letter-spacing:1px; line-height:1; }
  .uname::before,.uname::after{ content:attr(data-t); position:absolute; inset:0; }
  .uname::before{ color:var(--ol-cyan); transform:translate(-2px,1px); mix-blend-mode:screen; animation:gl 3.2s infinite steps(2); }
  .uname::after{ color:var(--ol-accent); transform:translate(2px,-1px); mix-blend-mode:screen; animation:gl2 2.7s infinite steps(2); }
  @keyframes gl{ 0%,92%,100%{clip-path:inset(0 0 0 0); transform:translate(-2px,1px)} 94%{clip-path:inset(40% 0 30% 0); transform:translate(-5px,0)} 97%{clip-path:inset(10% 0 60% 0); transform:translate(3px,0)} }
  @keyframes gl2{ 0%,90%,100%{clip-path:inset(0 0 0 0); transform:translate(2px,-1px)} 93%{clip-path:inset(60% 0 10% 0); transform:translate(5px,0)} 96%{clip-path:inset(20% 0 50% 0); transform:translate(-3px,0)} }

  /* tarjeta con esquina recortada (firma visual) */
  .notch{ position:relative;
    background:linear-gradient(180deg, rgba(var(--ol-accent-r),.12), rgba(29,22,28,.42));
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    box-shadow:0 10px 34px rgba(0,0,0,.4); }
  .notch::before{ content:""; position:absolute; inset:0; pointer-events:none;
    clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    border:1px solid var(--ol-border); }

  .pill{ border-radius:999px; }
  .link-pill{ transition:transform .18s ease, box-shadow .18s ease; }
  .link-pill:hover{ transform:translateY(-2px); box-shadow:0 12px 30px -14px rgba(var(--ol-accent-r),.6); }

  .social{ color:var(--ol-fg); transition:transform .25s cubic-bezier(.2,1.4,.4,1), color .25s; }
  .social svg{ filter:drop-shadow(0 0 6px rgba(var(--ol-accent-r),.7)); }
  .social:hover{ color:var(--ol-accent); transform:scale(1.25) translateY(-3px) rotate(-6deg); }

  /* galería + lightbox CSS :target (sin JS) */
  .gcell{ aspect-ratio:1; border-radius:calc(8px + 6px * var(--ol-r-scale,1)); overflow:hidden; display:block; position:relative;
    border:1px solid var(--ol-border); transition:transform .25s, box-shadow .25s; background:var(--ol-surface); }
  .gcell:hover{ transform:scale(1.05); box-shadow:0 0 16px rgba(var(--ol-accent-r),.7); z-index:1; }
  .gcell img{ width:100%; height:100%; object-fit:cover; display:block; }
  .lightbox{ position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
    background:rgba(8,5,7,.9); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    opacity:0; visibility:hidden; transition:opacity .25s, visibility .25s; padding:24px; }
  .lightbox:target{ opacity:1; visibility:visible; }
  .lightbox img{ max-width:min(430px,92vw); max-height:82vh; border-radius:18px;
    border:2px solid rgba(var(--ol-accent-r),.6); box-shadow:0 0 40px rgba(var(--ol-accent-r),.5); }
  .lightbox .close{ position:absolute; inset:0; }

  /* tienda (vender por DM/WhatsApp) */
  .shop{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .manga{ position:relative; display:flex; flex-direction:column; text-align:left; overflow:hidden;
    background:linear-gradient(180deg, rgba(var(--ol-accent-r),.12), rgba(29,22,28,.45));
    border:1px solid var(--ol-border); border-radius:calc(10px + 7px * var(--ol-r-scale,1));
    transition:transform .25s, box-shadow .25s; }
  .manga:hover{ transform:translateY(-3px); box-shadow:0 0 18px rgba(var(--ol-accent-r),.5); }
  .manga .cover{ aspect-ratio:2/3; overflow:hidden; position:relative; background:var(--ol-surface); }
  .manga .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .manga .info{ padding:10px 11px 12px; display:flex; flex-direction:column; gap:4px; }
  .manga .mtitle{ font-weight:600; color:var(--ol-fg-strong); font-size:13.5px; line-height:1.25; }
  .manga .mprice{ font-family:var(--ol-font-display); font-style:italic; font-size:16px;
    color:var(--ol-accent); text-shadow:var(--glow); }
  .buy{ display:block; margin-top:7px; padding:9px; text-align:center; font-weight:700; font-size:12.5px;
    letter-spacing:.3px; color:var(--ol-bg); border-radius:999px;
    background:linear-gradient(100deg, var(--ol-accent), var(--ol-accent-2));
    box-shadow:0 0 14px rgba(var(--ol-accent-r),.55); transition:transform .15s, box-shadow .25s; }
  .buy:hover{ box-shadow:0 0 22px rgba(var(--ol-accent-r),.9); }
  .buy:active{ transform:scale(.96); }
  /* ficha de producto (subpágina) */
  .pcover{ width:72%; max-width:260px; margin:0 auto; aspect-ratio:2/3; overflow:hidden;
    border-radius:calc(10px + 7px * var(--ol-r-scale,1));
    border:2px solid rgba(var(--ol-accent-r),.5); box-shadow:0 0 34px rgba(var(--ol-accent-r),.45); background:var(--ol-surface); }
  .pcover img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* formulario */
  .field{ background:var(--ol-surface); border:1px solid var(--ol-border); color:var(--ol-fg);
    border-radius:calc(8px + 6px * var(--ol-r-scale,1)); }
  .field::placeholder{ color:var(--ol-fg); opacity:.45; }
  .field:focus{ outline:2px solid var(--ol-accent); outline-offset:1px; }

  @media (prefers-reduced-motion: reduce){
    .stars{ animation:none } .uname::before,.uname::after{ animation:none }
    .link-pill,.social,.manga,.gcell,.buy{ transition:none }
    .link-pill:hover,.social:hover,.manga:hover,.gcell:hover{ transform:none }
  }
</style>
</head>
<body class="antialiased">
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="dots-layer" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="max-w-md mx-auto px-6 pt-8 pb-16">
    <div class="flex items-center justify-between mb-2">
      <a href="/" class="notch link-pill inline-flex items-center gap-1 px-3 py-1.5 text-[13px] font-semibold" style="color:var(--ol-fg-strong)"><span style="color:var(--ol-accent)">‹</span> inicio</a>
      <span class="text-[11px] uppercase tracking-[2px]" style="opacity:.55">tienda</span>
    </div>
    <div class="text-center mt-3 mb-1"><span class="serif-i glow-lilac" style="color:var(--ol-accent-2);font-size:24px">∴ mi tienda ♡ ∴</span></div>
    <p class="text-center text-[12px] mb-5" style="opacity:.65">toca un producto para ver detalles y pedirlo ♡</p>
    <div class="shop">
      <a class="manga" href="/producto-1/">
        <div class="cover"><img src="https://images.openlen.com/tematicas/coquette-satin-800.webp" alt="Nombre del producto"></div>
        <div class="info"><div class="mtitle">Nombre del producto</div><div class="mprice">$250</div><span class="text-[11px]" style="color:var(--ol-accent)">ver detalles →</span></div>
      </a>
      <a class="manga" href="/producto-2/">
        <div class="cover"><img src="https://images.openlen.com/tematicas/coquette-tulle-800.webp" alt="Otro producto"></div>
        <div class="info"><div class="mtitle">Otro producto</div><div class="mprice">$320</div><span class="text-[11px]" style="color:var(--ol-accent)">ver detalles →</span></div>
      </a>
    </div>
    <footer class="mt-12 text-[11px] text-center" style="opacity:.45">hecho con ♡</footer>
  </main>
</body>
</html>
