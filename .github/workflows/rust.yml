name: rust-html-engine

on:
  push:
    branches: [master, "rust/**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
      - "templates/starter/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
      - "templates/starter/**"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: ${{ matrix.os }} / rust-${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -p openlen-html-engine --all-targets -- -D warnings

      # Windows links the napi cdylib's napi_* symbols via delay-load, so the
      # standalone test binaries (incl. integration tests) build and run fine.
      - name: cargo test (full suite)
        if: runner.os == 'Windows'
        run: cargo test -p openlen-html-engine --all-targets

      # On Linux those napi_* symbols are only provided by the Node runtime.
      # The link-arg lets the test binaries link past them as undefined, but the
      # integration-test executables still abort at *load* — napi's module-
      # registration constructor calls napi_create_function during process
      # startup, before any test runs. The unit tests (--lib) don't trip that
      # constructor and exercise the same pure-Rust logic; the full integration
      # suite is covered by the Windows leg above. Production .node builds
      # (rust-prebuild.yml / napi build) are unaffected by this scoped flag.
      - name: cargo test (lib only — napi bins can't load standalone)
        if: runner.os == 'Linux'
        run: cargo test -p openlen-html-engine --lib
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Wl,--unresolved-symbols=ignore-all"

      - name: npm install (crate)
        working-directory: crates/html-engine
        run: npm install --no-audit --no-fund

      - name: napi build
        working-directory: crates/html-engine
        run: npm run build

      - name: node smoke tests
        working-directory: crates/html-engine
        run: npm run test:node
