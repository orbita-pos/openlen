name: rust-html-engine

on:
  push:
    branches: [master, "rust/**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
      - "templates/starter/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
      - "templates/starter/**"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: ${{ matrix.os }} / rust-${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -p openlen-html-engine --all-targets -- -D warnings

      - name: cargo test
        run: cargo test -p openlen-html-engine --all-targets
        # The napi cdylib references napi_* symbols that only the Node runtime
        # provides. Standalone test binaries link fine on Windows (delay-load)
        # but fail on Linux. The integration tests exercise pure-Rust paths and
        # never call into those symbols, so let the Linux test link tolerate
        # them as undefined. Production .node builds (rust-prebuild.yml) are
        # unaffected — this flag is scoped to this step on Linux only.
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-D warnings -C link-arg=-Wl,--unresolved-symbols=ignore-all' || '-D warnings' }}

      - name: npm install (crate)
        working-directory: crates/html-engine
        run: npm install --no-audit --no-fund

      - name: napi build
        working-directory: crates/html-engine
        run: npm run build

      - name: node smoke tests
        working-directory: crates/html-engine
        run: npm run test:node
